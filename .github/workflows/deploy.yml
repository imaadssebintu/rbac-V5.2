name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        env:
          REACT_APP_API_URL: /api
          REACT_APP_CLERK_PUBLISHABLE_KEY: ""
          REACT_APP_VAPID_PUBLIC_KEY: BFBMXydI6iXjCDXEWtWFxiBoEE4L93xcJOBbAS1ht0jSSvfyi3QCo2sMJB7QDO2xa1K0qaxjHplS67dIXD3M5a8
        run: |
          cd frontend
          npm run build

      - name: Copy built frontend to public/
        run: |
          rm -rf public
          mkdir -p public
          cp -r frontend/build/* public/

      - name: Package project (exclude node_modules, .git, .env)
        run: |
          tar czf /tmp/voya-app.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='*/node_modules' \
            .
          mv /tmp/voya-app.tar.gz ./

      - name: Upload package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "voya-app.tar.gz"
          target: "/tmp/"
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e

            echo "=== Extract code ==="
            mkdir -p ~/voya-app
            tar xzf /tmp/voya-app.tar.gz -C ~/voya-app/
            rm -f /tmp/voya-app.tar.gz
            cd ~/voya-app

            echo "=== Create .env file with latest secrets ==="
            # Preserve Clerk keys from existing .env before overwriting
            CLERK_PUBLISHABLE_EXISTING=$(grep -E '^REACT_APP_CLERK_PUBLISHABLE_KEY=' .env 2>/dev/null | head -1 || echo '')
            CLERK_SECRET_EXISTING=$(grep -E '^CLERK_SECRET_KEY=' .env 2>/dev/null | head -1 || echo '')

            cat > .env << 'ENVEOF'
            # Generated by deploy workflow - always overwritten on deploy
            DB_PASSWORD=root
            JWT_SECRET=Ertdfgxc
            # VAPID keys for push notifications (public key is also baked into frontend build)
            VAPID_PUBLIC_KEY=BFBMXydI6iXjCDXEWtWFxiBoEE4L93xcJOBbAS1ht0jSSvfyi3QCo2sMJB7QDO2xa1K0qaxjHplS67dIXD3M5a8
            VAPID_PRIVATE_KEY=LbgqlDJeVzx7L8u6CSTa7LpnYbmfxzIYjfpNSXo6SNs
            VAPID_SUBJECT=mailto:imaad.ssebintu@gmail.com
            ENVEOF

            # Append preserved Clerk keys (if they existed)
            [ -n "$CLERK_PUBLISHABLE_EXISTING" ] && echo "$CLERK_PUBLISHABLE_EXISTING" >> .env
            [ -n "$CLERK_SECRET_EXISTING" ] && echo "$CLERK_SECRET_EXISTING" >> .env

            echo "=== Build and start containers ==="
            docker compose down || true
            docker compose build
            docker compose up -d

            echo "=== Cleaning up old images ==="
            docker image prune -f

            echo "=== Deploy complete! ==="
